<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brain2 Console — Home Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: #f0eee9; overflow: hidden; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  #root { height: 100vh; }
  button { font-family: inherit; }
  ::selection { background: rgba(124,140,255,0.28); }
  @keyframes b2pulse { 0% { transform: scale(0.7); opacity: 0.55; } 70% { transform: scale(1.9); opacity: 0; } 100% { opacity: 0; } }
  .b2-pulse { animation: b2pulse 1.8s ease-out infinite; }
  @media (prefers-reduced-motion: reduce) { .b2-pulse { animation: none; } }
  .b2-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #8a8178; font-family: -apple-system, system-ui, sans-serif; font-size: 14px; }
  .b2-show-sm { display: none !important; }
  @media (max-width: 820px) {
    .b2-hide-sm { display: none !important; }
    .b2-show-sm { display: flex !important; }
  }
</style>
</head>
<body>
<div id="root"><div class="b2-loading">Loading Brain2 Console…</div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="tokens.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="charts.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="cards.jsx"></script>
<script type="text/babel" src="variations.jsx"></script>
<script type="text/babel" src="specimens.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
