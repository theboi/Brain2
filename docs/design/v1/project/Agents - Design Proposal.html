<style>

  html, body { margin: 0; }

  @media (prefers-reduced-motion: reduce) { .b2-spin, .b2-caret { animation: none; } }
  .b2-loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #8B8F98; font-family: system-ui, sans-serif; font-size: 14px; }
