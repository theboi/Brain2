[project]
name = "brain2"
version = "0.0.1"
description = "Self-hostable multi-tenant business knowledge system"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "fsrs>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.1"]

[project.scripts]
brain2-migrate = "brain2.store.migrations.runner:main"
brain2-api = "brain2.api:main"
brain2-mcp = "brain2.mcp:main"
brain2-worker = "brain2.runtime:worker_main"
brain2-init = "brain2.init_cmd:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["brain2*", "addons*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
